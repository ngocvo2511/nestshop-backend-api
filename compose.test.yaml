# Standalone disposable integration stack. Never merge into compose.yaml.
# The runner supplies a unique project, generated credentials and an ephemeral port.
services:
  postgres-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: shop_test
      POSTGRES_DB: shop_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Run npm run test:integration}
    ports:
      - '127.0.0.1::5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop_test -d shop_test']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
