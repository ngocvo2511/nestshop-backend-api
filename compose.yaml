name: nestshop-day2

x-api-environment: &api-environment
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: 3000
  DB_ENABLED: 'true'
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: shop
  DB_DATABASE: shop
  DB_PASSWORD: ${COMPOSE_DB_PASSWORD:?Set COMPOSE_DB_PASSWORD in .env.compose}
  JWT_ACCESS_SECRET: ${COMPOSE_JWT_ACCESS_SECRET:?Set COMPOSE_JWT_ACCESS_SECRET in .env.compose}
  UPLOAD_DIRECTORY: /app/uploads/products
  VNPAY_MODE: unconfigured

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD: ${COMPOSE_DB_PASSWORD:?Set COMPOSE_DB_PASSWORD in .env.compose}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop -d shop']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    image: nestshop-api:day2
    pull_policy: never
    environment: *api-environment
    command: ['node', 'dist/database/cli.js', 'migrate']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    image: nestshop-api:day2
    environment: *api-environment
    ports:
      - '127.0.0.1:${COMPOSE_API_PORT:-3300}:3000'
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
  uploads:
